<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ExploreDB</title>
    <base href="/" />
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/inter-400.css" rel="stylesheet">
    <link href="css/inter-500.css" rel="stylesheet">
    <link href="css/inter-700.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/app.css?v=1.1" rel="stylesheet" />
    <link href="ExploreDB.styles.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212529;
            margin: 0;
        }
        .blazor-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: #212529;
        }
        .blazor-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(13, 110, 253, 0.2);
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: blazor-spin 1s linear infinite;
        }
        @keyframes blazor-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="blazor-loading">
            <div class="blazor-spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sql-formatter.min.js"></script>
    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="js/query-editor-interop.js"></script>
    <script>
        // Global Bootstrap Tooltip Initializer - Bulletproof SPA Engine
        let currentTooltipTarget = null;
        
        document.body.addEventListener('mouseover', function(e) {
            let target = e.target.closest('[data-bs-tooltip="true"]');
            if (target !== currentTooltipTarget) {
                if (currentTooltipTarget) {
                    let oldTooltip = bootstrap.Tooltip.getInstance(currentTooltipTarget);
                    if (oldTooltip) oldTooltip.dispose();
                }
                
                currentTooltipTarget = target;
                
                if (target) {
                    let tooltip = new bootstrap.Tooltip(target, { container: 'body', trigger: 'manual' });
                    tooltip.show();
                }
            }
        });

        document.body.addEventListener('mouseout', function(e) {
            let target = e.target.closest('[data-bs-tooltip="true"]');
            if (target && !target.contains(e.relatedTarget)) {
                let tooltip = bootstrap.Tooltip.getInstance(target);
                if (tooltip) tooltip.dispose();
                if (currentTooltipTarget === target) {
                    currentTooltipTarget = null;
                }
            }
        });
        
        window.scrollToMainTop = () => {
            const main = document.querySelector('main.app-shell-main');
            if (main) main.scrollTo(0, 0);
            else window.scrollTo(0, 0);
        };

        // Fix for ghost tooltips on SPA navigation
        document.body.addEventListener('click', function(e) {
            let target = e.target.closest('[data-bs-tooltip="true"]');
            if (target) {
                let tooltip = bootstrap.Tooltip.getInstance(target);
                if (tooltip) tooltip.dispose();
                if (currentTooltipTarget === target) currentTooltipTarget = null;
            }
            // Fallback: forcefully remove any orphaned tooltip DOM elements
            document.querySelectorAll('.tooltip').forEach(t => t.remove());
        });

        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        };

        // Global Keyboard Shortcuts
        window.globalShortcuts = {
            queryRunnerInstance: null,
            registerQueryRunner: function (dotNetHelper) {
                this.queryRunnerInstance = dotNetHelper;
            },
            unregisterQueryRunner: function () {
                this.queryRunnerInstance = null;
            }
        };

        document.addEventListener('keydown', function (e) {
            // Intercept F5
            if (e.key === 'F5' || e.keyCode === 116) {
                e.preventDefault(); // Block browser refresh completely
                
                // If Query Runner is active, execute the query
                if (window.globalShortcuts && window.globalShortcuts.queryRunnerInstance) {
                    window.globalShortcuts.queryRunnerInstance.invokeMethodAsync('ExecuteQueryFromShortcut');
                }
            }
        });
    </script>
</body>

</html>
