<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ExploreDB</title>
    <base href="/" />
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/inter-400.css" rel="stylesheet">
    <link href="css/inter-500.css" rel="stylesheet">
    <link href="css/inter-700.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet" />
    <link href="ExploreDB.styles.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212529;
            margin: 0;
        }
        .blazor-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: #212529;
        }
        .blazor-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(13, 110, 253, 0.2);
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: blazor-spin 1s linear infinite;
        }
        @keyframes blazor-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="blazor-loading">
            <div class="blazor-spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/mermaid.min.js"></script>
    <script src="js/svg-pan-zoom.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
        window.renderMermaid = async () => {
            try {
                // Clear any existing mermaid data-processed attributes so it re-renders
                document.querySelectorAll('.mermaid').forEach(el => el.removeAttribute('data-processed'));
                await mermaid.run({
                    querySelector: '.mermaid'
                });
                
                // Initialize pan and zoom on the resulting SVG
                var svgs = document.querySelectorAll('.mermaid svg');
                if (svgs.length > 0) {
                    var svg = svgs[0];
                    // Ensure the SVG takes up the full container height/width
                    svg.style.width = '100%';
                    svg.style.height = '100%';
                    svg.style.maxWidth = 'none';
                    
                    if (window.mermaidPanZoom) {
                        window.mermaidPanZoom.destroy();
                    }
                    window.mermaidPanZoom = svgPanZoom(svg, {
                        zoomEnabled: true,
                        controlIconsEnabled: false,
                        fit: true,
                        center: true,
                        minZoom: 0.5,
                        maxZoom: 10
                    });
                }
            } catch (e) {
                console.error('Mermaid render error:', e);
            }
        };
    </script>
</body>

</html>
